name: Update GitHub Visuals

on:
  push:
    paths:
      - README.md
      - assets/**
      - scripts/validate_visuals.py
      - .github/workflows/github-visuals.yml
  pull_request:
    paths:
      - README.md
      - assets/**
      - scripts/validate_visuals.py
      - .github/workflows/github-visuals.yml
  schedule:
    - cron: '17 6 * * *' # 03:17 America/Sao_Paulo (UTC-3)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-visuals-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep the profile identity stable when validating this workflow in a fork.
  PROFILE_USERNAME: FilipeAndrade

jobs:
  generate:
    name: Generate and validate animations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate 3D contribution calendars
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ env.PROFILE_USERNAME }}

      - name: Generate contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ env.PROFILE_USERNAME }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake.svg?color_snake=%2358a6ff
            dist/snake-dark.svg?palette=github-dark&color_snake=%2358a6ff

      - name: Collect and validate every README image
        run: |
          cp profile-3d-contrib/profile-south-season-animate.svg dist/profile-3d.svg
          cp profile-3d-contrib/profile-night-rainbow.svg dist/profile-3d-dark.svg
          python3 scripts/validate_visuals.py dist

      - name: Save validated animations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-visuals
          path: dist/*.svg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Refresh profile images
    needs: generate
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the latest default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download validated animations
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: profile-visuals
          path: assets

      - name: Commit only changed profile images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/profile-3d.svg assets/profile-3d-dark.svg assets/snake.svg assets/snake-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile animations"
            git push
          fi
